stages:
  preprocess:
    cmd: .venv/bin/python src/preprocess.py
    deps:
    - data/fruits.csv
    - src/preprocess.py
    outs:
    - data/fruits_clean.csv
  train:
    cmd: .venv/bin/python src/train.py
    deps:
    - data/fruits_clean.csv
    - src/train.py
    outs:
    - models/figures/clusters.png
    - models/figures/elbow.png
    - models/figures/silhouette.png
    - models/fruits_clustered.csv
    - models/model.joblib
  evaluate:
    cmd: .venv/bin/python src/evaluate.py
    deps:
    - data/fruits_clean.csv
    - src/evaluate.py
    - models/model.joblib
    outs:
    - models/evaluate_metrics.json
  report:
    cmd: .venv/bin/python src/generate_evidently_report.py
    deps:
    - data/fruits_clean.csv
    - src/generate_evidently_report.py
    outs:
    - models/evidently_report.html
  shap:
    cmd: .venv/bin/python src/xai_shap.py
    deps:
    - data/fruits_clean.csv
    - src/xai_shap.py
    - models/model.joblib
    outs:
    - models/figures/shap_summary.png
